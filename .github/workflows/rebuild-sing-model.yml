name: Rebuild Sing voice model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CONVERSION_REV: 5029e6df8100650fe175d3e276fffb0177754ca1
      REFERENCE_REV: 25f44ffb55ee3c301281bba21b2d6d311cb69ae2
      CHECKPOINT_REV: ac9b0614ab3cd7f77219e18ba494dfd93956c348
      CHECKPOINT_SHA256: 87201f4d31afb5bc79993230fc49446918425574db48c01c405e44f365c7559e
      WEIGHTS_SHA256: 970a99fb4b15724bf76d2918ceb177df592c69265d3e2fabaab6e5ba72738e62
      RELEASE_TAG: sing-model-v0.23

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Install public export tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==2.9.0" \
            "coremltools==9.0" \
            "numpy<2.3" \
            "einops==0.6.1" \
            "beartype==0.14.1" \
            "rotary-embedding-torch==0.3.5" \
            librosa pyyaml pandas soundfile ml-collections tqdm \
            "segmentation-models-pytorch==0.3.3" "timm==0.9.2" "omegaconf==2.2.3"

      - name: Fetch pinned source revisions
        run: |
          git clone --filter=blob:none https://github.com/john-rocky/coreai-model-zoo.git build/coreai-model-zoo
          git -C build/coreai-model-zoo checkout "$CONVERSION_REV"
          test "$(git -C build/coreai-model-zoo rev-parse HEAD)" = "$CONVERSION_REV"

          git clone --filter=blob:none https://github.com/KimberleyJensen/Mel-Band-Roformer-Vocal-Model.git build/reference
          git -C build/reference checkout "$REFERENCE_REV"
          test "$(git -C build/reference rev-parse HEAD)" = "$REFERENCE_REV"

      - name: Fetch and verify checkpoint
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://huggingface.co/KimberleyJSN/melbandroformer/resolve/$CHECKPOINT_REV/MelBandRoformer.ckpt" \
            -o build/MelBandRoformer.ckpt
          echo "$CHECKPOINT_SHA256  build/MelBandRoformer.ckpt" | shasum -a 256 -c -

      - name: Fetch and verify golden audio
        run: python harness/sing/fetch_goldens.py --output build/goldens

      - name: Export Core ML model
        run: |
          python harness/sing/export_coreml.py \
            build/coreai-model-zoo \
            build/reference \
            build/MelBandRoformer.ckpt \
            build/goldens/golden_raw.f32 \
            build/export \
            --unpinned-tools

      - name: Verify recovered weights and compiled-model parity
        run: |
          echo "$WEIGHTS_SHA256  build/export/separator.mlmodelc/weights/weight.bin" | shasum -a 256 -c -
          python - <<'PY'
          import coremltools as ct
          import numpy as np
          from pathlib import Path

          root = Path("build/export")
          compiled = root / "separator.mlmodelc"
          model = ct.models.CompiledMLModel(str(compiled), compute_units=ct.ComputeUnit.CPU_ONLY)

          shape = (1, 2050, 201, 2)
          spectrum = np.fromfile(root / "spectrum.f32", dtype=np.float32).reshape(shape)
          expected = np.fromfile(root / "expected-spectrum.f32", dtype=np.float32).reshape(shape)
          actual = np.asarray(model.predict({"spectrum": spectrum})["vocals_spectrum"], dtype=np.float32)

          if actual.shape != expected.shape or not np.isfinite(actual).all():
              raise SystemExit("compiled model returned malformed/non-finite output")

          a, b = actual.astype(np.float64).ravel(), expected.astype(np.float64).ravel()
          cosine = float(np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b)))
          rms_ratio = float(np.sqrt(np.mean(a * a) / np.mean(b * b)))
          print(f"compiled parity: cosine={cosine:.9f}, rms_ratio={rms_ratio:.9f}")
          if cosine < 0.9999 or abs(rms_ratio - 1.0) >= 0.01:
              raise SystemExit("compiled model failed pinned golden parity")

          zero = np.zeros(shape, dtype=np.float32)
          silent = np.asarray(model.predict({"spectrum": zero})["vocals_spectrum"], dtype=np.float32)
          if not np.isfinite(silent).all() or float(np.max(np.abs(silent))) != 0.0:
              raise SystemExit("compiled model failed zero-input safety check")
          print("compiled zero-input check: passed")
          PY

      - name: Prepare release assets and manifest
        run: |
          mkdir -p build/publish
          cp build/export/separator.mlmodelc/weights/weight.bin build/publish/weights-weight.bin
          cp build/export/separator.mlmodelc/model.mil build/publish/model.mil
          cp build/export/separator.mlmodelc/metadata.json build/publish/metadata.json
          cp build/export/separator.mlmodelc/coremldata.bin build/publish/coremldata.bin
          cp build/export/separator.mlmodelc/analytics/coremldata.bin build/publish/analytics-coremldata.bin
          cp harness/sing/NOTICE build/publish/NOTICE
          cp harness/sing/model.json build/publish/source-model.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          publish = Path("build/publish")
          mapping = [
              ("weights/weight.bin", "weights-weight.bin"),
              ("model.mil", "model.mil"),
              ("metadata.json", "metadata.json"),
              ("coremldata.bin", "coremldata.bin"),
              ("analytics/coremldata.bin", "analytics-coremldata.bin"),
          ]
          files = []
          for local_path, asset in mapping:
              p = publish / asset
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              files.append({
                  "path": local_path,
                  "asset": asset,
                  "size": p.stat().st_size,
                  "sha256": digest,
              })
              print(f'SING_FILE {local_path} {asset} {p.stat().st_size} {digest}')
          manifest = {
              "format": 1,
              "source": "spoti.pw v0.23 pinned Mel-Band RoFormer export",
              "checkpoint_sha256": "87201f4d31afb5bc79993230fc49446918425574db48c01c405e44f365c7559e",
              "weights_match_original": files[0]["sha256"] == "970a99fb4b15724bf76d2918ceb177df592c69265d3e2fabaab6e5ba72738e62",
              "compiler": "Xcode 26.6 / coremltools 9.0 / torch 2.9.0",
              "files": files,
          }
          (publish / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print("SING_MANIFEST_JSON=" + json.dumps(manifest, separators=(",", ":")))
          PY

      - name: Publish validated model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Refusing to overwrite assets pinned by the app; use a new tag and update the manifest instead."
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/publish/* \
            --target "$GITHUB_SHA" \
            --title "Sing voice model for v0.23" \
            --prerelease \
            --notes "Recovered from the pinned public Sing sources after the original model host became unavailable. The learned weight payload is byte-for-byte identical to the v0.23 model. The Core ML wrapper is freshly compiled with public tools and must pass the pinned spectral golden parity and zero-input checks before this workflow publishes it. The model remains separate from the IPA."
