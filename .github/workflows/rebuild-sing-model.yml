name: Rebuild Sing voice model

on:
  workflow_dispatch:
  push:
    branches: [dev/v0.23]
    paths:
      - .github/workflows/rebuild-sing-model.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CONVERSION_REV: 5029e6df8100650fe175d3e276fffb0177754ca1
      REFERENCE_REV: 25f44ffb55ee3c301281bba21b2d6d311cb69ae2
      CHECKPOINT_REV: ac9b0614ab3cd7f77219e18ba494dfd93956c348
      CHECKPOINT_SHA256: 87201f4d31afb5bc79993230fc49446918425574db48c01c405e44f365c7559e
      RELEASE_TAG: sing-model-v0.23

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install pinned public export tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==2.9.0" \
            "coremltools==9.0" \
            "numpy<2.3" \
            "einops==0.6.1" \
            "beartype==0.14.1" \
            "rotary-embedding-torch==0.3.5" \
            librosa pyyaml pandas soundfile ml-collections tqdm \
            "segmentation-models-pytorch==0.3.3" "timm==0.9.2" "omegaconf==2.2.3"

      - name: Fetch pinned source revisions
        run: |
          git clone --filter=blob:none https://github.com/john-rocky/coreai-model-zoo.git build/coreai-model-zoo
          git -C build/coreai-model-zoo checkout "$CONVERSION_REV"
          test "$(git -C build/coreai-model-zoo rev-parse HEAD)" = "$CONVERSION_REV"

          git clone --filter=blob:none https://github.com/KimberleyJensen/Mel-Band-Roformer-Vocal-Model.git build/reference
          git -C build/reference checkout "$REFERENCE_REV"
          test "$(git -C build/reference rev-parse HEAD)" = "$REFERENCE_REV"

      - name: Fetch and verify checkpoint
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://huggingface.co/KimberleyJSN/melbandroformer/resolve/$CHECKPOINT_REV/MelBandRoformer.ckpt" \
            -o build/MelBandRoformer.ckpt
          echo "$CHECKPOINT_SHA256  build/MelBandRoformer.ckpt" | shasum -a 256 -c -

      - name: Fetch and verify golden audio
        run: python harness/sing/fetch_goldens.py --output build/goldens

      - name: Export Core ML model
        run: |
          python harness/sing/export_coreml.py \
            build/coreai-model-zoo \
            build/reference \
            build/MelBandRoformer.ckpt \
            build/goldens/golden_raw.f32 \
            build/export \
            --unpinned-tools

      - name: Stage and verify exact Sing payload
        run: |
          python harness/sing/stage_model.py build/export/separator.mlmodelc build/spoti-sing
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "weights/weight.bin": (488986336, "970a99fb4b15724bf76d2918ceb177df592c69265d3e2fabaab6e5ba72738e62"),
              "model.mil": (669061, "966560ed5125174a98f19b94f5de04450a7112ade0e731f2236c202c0280a623"),
              "metadata.json": (2431, "52a8d5e3f09e33236d495dbed5bbce1c75bac6f2a6b6097637cf214f37c1de53"),
              "coremldata.bin": (507, "2090acaf7a6df72ec83857cb88d101654023a6baad222a25d0173827d3347e28"),
              "analytics/coremldata.bin": (243, "f7ee4ec9b5cc1c97171bd5aad93af61e183aa0db1451ef3b775bd4e77f0b7cfd"),
          }
          root = Path("build/spoti-sing")
          for name, (size, digest) in expected.items():
              p = root / name
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if p.stat().st_size != size or actual != digest:
                  raise SystemExit(f"{name}: payload mismatch")
              print(f"{name}: verified")
          PY

      - name: Prepare flat release assets
        run: |
          mkdir -p build/publish
          cp build/spoti-sing/weights/weight.bin build/publish/weights-weight.bin
          cp build/spoti-sing/model.mil build/publish/model.mil
          cp build/spoti-sing/metadata.json build/publish/metadata.json
          cp build/spoti-sing/coremldata.bin build/publish/coremldata.bin
          cp build/spoti-sing/analytics/coremldata.bin build/publish/analytics-coremldata.bin
          cp build/spoti-sing/NOTICE build/publish/NOTICE
          cp build/spoti-sing/README.md build/publish/README.md
          shasum -a 256 build/publish/*

      - name: Publish verified model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/publish/* --clobber
          else
            gh release create "$RELEASE_TAG" build/publish/* \
              --target "$GITHUB_SHA" \
              --title "Sing voice model for v0.23" \
              --prerelease \
              --notes "Rebuilt from the pinned public Sing sources. The workflow verifies every model file against the hashes already pinned by spoti.pw before publishing. This model remains separate from the IPA."
          fi
