name: Build personal v0.23

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Which v0.23 line to build"
        required: true
        default: "stable/v0.23"
        type: choice
        options:
          - baseline/v0.23-beta
          - stable/v0.23
          - dev/v0.23
      ipa_url:
        description: "Direct URL to a decrypted Spotify IPA"
        required: true
        type: string
      include_eevee:
        description: "Inject EeveeSpotify too"
        required: true
        default: false
        type: boolean
      eevee_ref:
        description: "Eevee version/tag/branch (used only when Eevee is enabled)"
        required: true
        default: "v7.0.0"
        type: string
      upload_method:
        description: "Where to put the result"
        required: true
        default: artifacts
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout selected v0.23 source
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_branch }}
          path: spoti
          fetch-depth: 0

      - name: Checkout Eevee
        if: ${{ inputs.include_eevee }}
        uses: actions/checkout@v4
        with:
          repository: SideloadLabs/EeveeSpotifyReincarnated
          ref: ${{ inputs.eevee_ref }}
          path: eevee
          submodules: recursive

      - uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: source_branch,include_eevee,eevee_ref,upload_method

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --upgrade --break-system-packages             git+https://github.com/asdfzxcvbn/pyzule-rw.git

          ARCH=$(uname -m)
          [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL             "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}"             -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Download Spotify IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p spoti/ipa
          curl -fsSL --retry 3 "$IPA_URL" -o spoti/ipa/spotify.ipa
          case "$(file --mime-type -b spoti/ipa/spotify.ipa)" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::Downloaded file is not an IPA"; exit 1 ;;
          esac

          VERSION=$(unzip -p spoti/ipa/spotify.ipa 'Payload/*.app/Info.plist' 2>/dev/null             | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || true)
          [ -n "$VERSION" ] || VERSION="unknown"
          echo "SPOTIFY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected Spotify $VERSION"

      - name: Build spoti.pw v0.23 source
        working-directory: spoti
        run: |
          make release
          IPA=$(find out -maxdepth 1 -type f -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::spoti.pw did not produce an IPA"; exit 1; }
          echo "SPOTI_IPA=$GITHUB_WORKSPACE/spoti/$IPA" >> "$GITHUB_ENV"
          echo "SPOTI_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare stock v0.23 result
        if: ${{ !inputs.include_eevee }}
        run: |
          mkdir -p output
          OUT="$GITHUB_WORKSPACE/output/Spotify-${SPOTIFY_VERSION}-spoti-v0.23.ipa"
          cp "$SPOTI_IPA" "$OUT"
          echo "FINAL_IPA=$OUT" >> "$GITHUB_ENV"
          echo "EEVEE_VERSION=not-injected" >> "$GITHUB_ENV"

      - name: Build EeveeSwiftProtobuf.framework
        if: ${{ inputs.include_eevee }}
        working-directory: eevee
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build Eevee package
        if: ${{ inputs.include_eevee }}
        working-directory: eevee
        env:
          REPO_SLUG: SideloadLabs/EeveeSpotifyReincarnated
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name 'com.eevee.spotify_*.deb' | head -1)
          [ -n "$DEB_PATH" ] || { echo "::error::Eevee package was not produced"; exit 1; }
          echo "EEVEE_DEB=$GITHUB_WORKSPACE/eevee/$DEB_PATH" >> "$GITHUB_ENV"
          VERSION=$(grep -E '^Version:' control | awk '{print $2}' | head -1)
          [ -n "$VERSION" ] || VERSION="${{ inputs.eevee_ref }}"
          echo "EEVEE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Eevee sideload shim
        if: ${{ inputs.include_eevee }}
        working-directory: eevee
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh
          test -f packages/zxPluginsInject.dylib
          echo "ZXPI_DYLIB=$GITHUB_WORKSPACE/eevee/packages/zxPluginsInject.dylib" >> "$GITHUB_ENV"

      - name: Inject Eevee without stripping spoti.pw extensions
        if: ${{ inputs.include_eevee }}
        run: |
          EXTRACT="$RUNNER_TEMP/eevee-deb"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          dpkg-deb -R "$EEVEE_DEB" "$EXTRACT"

          DYLIB=$(find "$EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE=$(find "$EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK=$(find "$EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)
          [ -n "$DYLIB" ] || { echo "::error::EeveeSpotify.dylib missing"; exit 1; }

          INJECT=("$DYLIB")
          [ -n "$FRAMEWORK" ] && INJECT+=("$FRAMEWORK")
          [ -n "$BUNDLE" ] && INJECT+=("$BUNDLE")

          mkdir -p output
          OUT="$GITHUB_WORKSPACE/output/Spotify-${SPOTIFY_VERSION}-spoti-v0.23-Eevee-${EEVEE_VERSION}.ipa"

          # Do not use -u/-du here. v0.23 has its own Live Activity extension,
          # and stripping extensions would remove it.
          cyan -i "$SPOTI_IPA" -o "$OUT"             -f "${INJECT[@]}" -c 9 -m 15.0 -s --overwrite

          echo "FINAL_IPA=$OUT" >> "$GITHUB_ENV"

      - name: LC-inject Eevee sideload shim
        if: ${{ inputs.include_eevee }}
        run: |
          ipapatch --input "$FINAL_IPA" --inplace --noconfirm             --dylib "$ZXPI_DYLIB"

      - name: Verify result
        run: |
          test -f "$FINAL_IPA"
          echo "Final IPA:"
          ls -lh "$FINAL_IPA"

          if unzip -l "$FINAL_IPA" | grep -q 'SpotifyGlassLiveActivity.appex'; then
            echo "Live Activity extension: present"
          else
            echo "::warning::spoti.pw Live Activity extension not found"
          fi

          if [ "${{ inputs.include_eevee }}" = "true" ]; then
            unzip -l "$FINAL_IPA" | grep -q 'EeveeSpotify.dylib' || {
              echo "::error::EeveeSpotify.dylib missing from final IPA"; exit 1;
            }
            unzip -l "$FINAL_IPA" | grep -q 'zxPluginsInject.dylib' || {
              echo "::error::Eevee sideload shim missing from final IPA"; exit 1;
            }
          fi

      - name: Build summary
        run: |
          {
            echo "## Personal v0.23 build"
            echo ""
            echo "- Source: \`${{ inputs.source_branch }}\`"
            echo "- Source commit: \`$SPOTI_COMMIT\`"
            echo "- Spotify: \`$SPOTIFY_VERSION\`"
            echo "- Eevee: \`$EEVEE_VERSION\`"
            echo "- Output: \`$(basename "$FINAL_IPA")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: ${{ inputs.upload_method == 'artifacts' || inputs.upload_method == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Personal-v023-${{ github.run_id }}
          path: ${{ env.FINAL_IPA }}
          if-no-files-found: error

      - name: Upload to filebin.net
        if: ${{ inputs.upload_method == 'filebin' || inputs.upload_method == 'both' }}
        run: |
          BIN="personal-v023-${{ github.run_id }}-${{ github.run_attempt }}"
          NAME=$(basename "$FINAL_IPA")
          curl -fsS -X POST             -H "Content-Type: application/octet-stream"             --data-binary "@$FINAL_IPA"             "https://filebin.net/$BIN/$NAME" >/dev/null
          {
            echo ""
            echo "### filebin.net"
            echo "- https://filebin.net/$BIN/$NAME"
          } >> "$GITHUB_STEP_SUMMARY"
