name: Test redesigned player menu

on:
  push:
    branches: [dev/v0.23]
    paths:
      - tweak/Sources/Redesigned/Player/PlayerMenu.x
      - harness/playermenu/**
      - .github/workflows/test-player-menu.yml
  workflow_dispatch:

jobs:
  menu:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          fetch-depth: 1

      - name: Build player-menu harness
        run: |
          THEOS="$GITHUB_WORKSPACE/theos" harness/playermenu/build.sh

      - name: Run menu harness
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep 'iPhone' | grep -Eo '[0-9A-F-]{36}' | head -1)
          test -n "$UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          python3 - "$UDID" <<'PY'
          import subprocess, sys
          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=120)
          except subprocess.TimeoutExpired:
              raise SystemExit("simulator did not finish booting within 120 seconds")
          PY
          xcrun simctl install "$UDID" harness/playermenu/build/PlayerMenuHarness.app

          set +e
          xcrun simctl launch --console "$UDID" com.vojta.playermenuharness outside > /tmp/player-menu.log 2>&1 &
          LOGPID=$!
          set -e
          sleep 6
          xcrun simctl terminate "$UDID" com.vojta.playermenuharness >/dev/null 2>&1 || true
          kill "$LOGPID" >/dev/null 2>&1 || true
          wait "$LOGPID" || true

          cat /tmp/player-menu.log
          grep -q 'Music Haptics' /tmp/player-menu.log
          grep -q 'Sing Mode' /tmp/player-menu.log
          grep -q 'system menu visible' /tmp/player-menu.log
          grep -q 'Spotify.*sheet.*out of sight' /tmp/player-menu.log
