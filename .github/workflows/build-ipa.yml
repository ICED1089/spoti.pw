name: Build IPA — personal fork / optional Eevee
run-name: "IPA ${{ github.ref_name }} • Eevee ${{ inputs.include_eevee && 'on' || 'off' }} • BeatIt ${{ inputs.include_beatit && 'on' || 'off' }}"

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      include_beatit:
        description: "Build MIT BeatIt Core ML rhythm/downbeat analysis (laboratory Off until enabled in app)"
        required: false
        default: true
        type: boolean
      include_eevee:
        description: "Also build and inject Eevee 7 into the experimental spoti.pw IPA"
        required: false
        default: false
        type: boolean
      eevee_ref:
        description: "Eevee fork ref (Master for Eevee 7)"
        required: true
        default: "Master"
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"
  SG_DJ_BEATIT: ${{ inputs.include_beatit && '1' || '0' }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record source revision
        id: source
        run: echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require current stable as dev ancestor
        if: github.ref_name == 'dev/v0.23'
        run: |
          git fetch --no-tags origin stable/v0.23
          git merge-base --is-ancestor origin/stable/v0.23 HEAD || {
            echo "::error::Dev is behind stable. Sync dev onto current stable before building."
            exit 1
          }

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Identify exact build toolchain
        id: toolchain
        shell: bash
        run: |
          {
            xcodebuild -version
            git -C theos rev-parse HEAD
          } | shasum -a 256 | cut -c1-20 | awk '{print "id="$1}' >> "$GITHUB_OUTPUT"

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      # 3m12s was spent generating the remote flags in the original run.
      # Cache by the SHA of the actual user-supplied decrypted IPA.
      - name: Cache Spotify remote-config flag table
        id: flag-cache
        uses: actions/cache@v4
        with:
          path: tweak/Sources/Shared/Flags/SGFlagList.m
          key: spoti-flags-v2-${{ hashFiles('scripts/extract-flags.py') }}-${{ hashFiles('ipa/spotify.ipa') }}

      # Match source tree, SDK/toolchain, IPA content and DJ mode exactly.
      - name: Restore compiled dev tweak and BeatIt resources
        id: tweak-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tweak/packages
            vendor/beatit/build
            vendor/signalsmith/build
          key: spoti-compiled-v5-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ inputs.include_beatit }}-${{ hashFiles('ipa/spotify.ipa') }}-${{ hashFiles('tweak/Makefile', 'tweak/Sources/**', '!tweak/Sources/Shared/Flags/SGFlagList.m', 'vendor/beatit/Makefile', 'vendor/signalsmith/Makefile', 'scripts/*.sh', 'scripts/*.py', 'extension/**', 'plist/**', 'version.txt') }}

      - name: Build and inject spoti.pw
        env:
          SG_USE_CACHED_TWEAK: ${{ steps.tweak-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: make release

      - name: Save compiled dev tweak for matching builds
        if: steps.tweak-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tweak/packages
            vendor/beatit/build
            vendor/signalsmith/build
          key: ${{ steps.tweak-cache.outputs.cache-primary-key }}

      - name: Record mod-only IPA
        run: |
          IPA="$(ls -t out/*.ipa | head -1)"
          test -f "$IPA"
          OUTPUT="out/Spotify-dev-${{ steps.source.outputs.short }}-Solo.ipa"
          mv "$IPA" "$OUTPUT"
          echo "FINAL_IPA=$GITHUB_WORKSPACE/$OUTPUT" >> "$GITHUB_ENV"

      - name: Checkout Eevee fork (optional)
        if: ${{ inputs.include_eevee }}
        uses: actions/checkout@v5
        with:
          repository: ICED1089/EeveeSpotifyReincarnated
          ref: ${{ inputs.eevee_ref }}
          path: eevee
          submodules: recursive

      - name: Pin checked-out Eevee version
        if: ${{ inputs.include_eevee }}
        id: eevee_revision
        run: echo "sha=$(git -C eevee rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Renamed SwiftProtobuf plus the Eevee package/shim cost 9m35s cold.
      - name: Restore prebuilt Eevee and renamed SwiftProtobuf
        if: ${{ inputs.include_eevee }}
        id: eevee_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.THEOS }}/lib/iphone/rootless/EeveeSwiftProtobuf.framework
            eevee/packages
          key: eevee7-compiled-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ env.SWIFTPROTOBUF_VERSION }}-${{ steps.eevee_revision.outputs.sha }}

      - name: Set up Node for Eevee 7
        if: ${{ inputs.include_eevee }}
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Eevee IPA injection tools
        if: ${{ inputs.include_eevee }}
        run: |
          brew install wget
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then SUFFIX=macos-amd64; else SUFFIX=macos-arm64; fi
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build Eevee SwiftProtobuf
        if: ${{ inputs.include_eevee && steps.eevee_cache.outputs.cache-hit != 'true' }}
        working-directory: eevee
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build Eevee rootless package and sideload shim
        if: ${{ inputs.include_eevee && steps.eevee_cache.outputs.cache-hit != 'true' }}
        working-directory: eevee
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh
          test -f packages/zxPluginsInject.dylib

      - name: Save compiled Eevee binaries for exact source revision
        if: ${{ inputs.include_eevee && steps.eevee_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.THEOS }}/lib/iphone/rootless/EeveeSwiftProtobuf.framework
            eevee/packages
          key: ${{ steps.eevee_cache.outputs.cache-primary-key }}

      - name: Verify cached Eevee binaries
        if: ${{ inputs.include_eevee }}
        shell: bash
        run: |
          test -d "$THEOS/lib/iphone/rootless/EeveeSwiftProtobuf.framework"
          test -f eevee/packages/zxPluginsInject.dylib
          find eevee/packages -maxdepth 1 -type f -name 'com.eevee.spotify_*.deb' | grep -q .
          echo "Eevee cache SHA confirmed" >> "$GITHUB_STEP_SUMMARY"

      - name: Inject Eevee into personal dev IPA
        if: ${{ inputs.include_eevee }}
        run: |
          EXTRACT="$RUNNER_TEMP/eevee-deb"
          mkdir -p "$EXTRACT"
          DEB="$(find eevee/packages -name 'com.eevee.spotify_*.deb' | head -1)"
          test -n "$DEB"
          dpkg-deb -R "$DEB" "$EXTRACT"
          DYLIB="$(find "$EXTRACT" -name EeveeSpotify.dylib | head -1)"
          BUNDLE="$(find "$EXTRACT" -type d -name EeveeSpotify.bundle | head -1)"
          FRAMEWORK="$(find "$EXTRACT" -type d -name EeveeSwiftProtobuf.framework | head -1)"
          test -n "$DYLIB"
          INJECT=("$DYLIB")
          if [ -n "$FRAMEWORK" ]; then INJECT+=("$FRAMEWORK"); fi
          if [ -n "$BUNDLE" ]; then INJECT+=("$BUNDLE"); fi
          OUT="$GITHUB_WORKSPACE/out/Spotify-dev-${{ steps.source.outputs.short }}-Eevee7.ipa"
          cyan -i "$FINAL_IPA" -o "$OUT" -f "${INJECT[@]}" -c 9 -m 15.0 -s --overwrite
          ipapatch --input "$OUT" --inplace --noconfirm --dylib "$GITHUB_WORKSPACE/eevee/packages/zxPluginsInject.dylib"
          unzip -l "$OUT" | grep -q EeveeSpotify.dylib
          unzip -l "$OUT" | grep -q zxPluginsInject.dylib
          echo "FINAL_IPA=$OUT" >> "$GITHUB_ENV"
          echo "Injected Eevee into the personal dev fork; no upstream Chroma release was used" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify dev IPA
        run: |
          test -f "$FINAL_IPA"
          unzip -l "$FINAL_IPA" | grep -q spotifyglass.dylib
          DYLIB="$(unzip -Z1 "$FINAL_IPA" | grep -E '(^|/)spotifyglass[.]dylib
            unzip -l "$FINAL_IPA" | grep -q 'SpotifyGlassDJ.bundle/BeatThis_small0.mlpackage/Manifest.json' || {
              echo "::error::BeatIt Core ML resources absent from IPA"
              exit 1
            }
            echo "Pinned BeatIt Core ML resource found in dev IPA" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! unzip -l "$FINAL_IPA" | grep -q SpotifyGlassLiveActivity.appex; then
            echo "::warning::Live Activity extension was not preserved"
          fi
          ls -lh "$FINAL_IPA"

      - name: Report cache usage and source
        if: always()
        run: |
          echo "### Build provenance and speed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Spotify flag table reused: ${{ steps.flag-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compiled spoti.pw reused: ${{ steps.tweak-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Eevee build requested: ${{ inputs.include_eevee }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Eevee binaries reused: ${{ steps.eevee_cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cold builds do not have a five-minute guarantee." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti-dev-${{ steps.source.outputs.short }}-${{ inputs.include_eevee && 'Eevee7' || 'Solo' }}
          path: ${{ env.FINAL_IPA }}
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in "$FINAL_IPA"; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
 | head -1)"
          test -n "$DYLIB"
          unzip -p "$FINAL_IPA" "$DYLIB" > "$RUNNER_TEMP/spotifyglass-provenance.dylib"
          strings "$RUNNER_TEMP/spotifyglass-provenance.dylib" | grep -Fq "${{ steps.source.outputs.short }}" || {
            echo "::error::IPA contains wrong/old source binary"
            exit 1
          }
          if [ "$SG_DJ_BEATIT" = "1" ]; then
            unzip -l "$FINAL_IPA" | grep -q 'SpotifyGlassDJ.bundle/BeatThis_small0.mlpackage/Manifest.json' || {
              echo "::error::BeatIt Core ML resources absent from IPA"
              exit 1
            }
            echo "Pinned BeatIt Core ML resource found in dev IPA" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! unzip -l "$FINAL_IPA" | grep -q SpotifyGlassLiveActivity.appex; then
            echo "::warning::Live Activity extension was not preserved"
          fi
          ls -lh "$FINAL_IPA"

      - name: Report cache usage and source
        if: always()
        run: |
          echo "### Build provenance and speed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Spotify flag table reused: ${{ steps.flag-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compiled spoti.pw reused: ${{ steps.tweak-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Eevee build requested: ${{ inputs.include_eevee }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Eevee binaries reused: ${{ steps.eevee_cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cold builds do not have a five-minute guarantee." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.dev.ipa
          path: ${{ env.FINAL_IPA }}
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in "$FINAL_IPA"; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
